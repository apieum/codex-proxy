name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# The default token permissions depend on repository settings and are often
# write. Anyone can open a pull request on a public repository, so keep the
# token read-only: nothing here needs to write back.
permissions:
  contents: read

# A newer push supersedes the run it interrupts; do not keep paying for the
# old one. Pull requests are keyed separately from branch pushes.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      # pyproject declares requires-python = ">=3.12", so both ends of that
      # promise are verified: the floor and the version used in development.
      matrix:
        python-version: ["3.12", "3.14"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-suffix: py${{ matrix.python-version }}

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync --all-groups --python ${{ matrix.python-version }}

      - name: Lint (ruff)
        run: uv run ruff check .

      - name: Type check (mypy)
        run: uv run mypy proxy

      - name: Tests (pytest)
        run: uv run pytest ./proxy/tests -v
