model_list:
  # The only Cerebras model confirmed available in production on the current
  # public catalogue (llama-3.3-70b and qwen-3-32b are deprecated).
  - model_name: cerebras-gpt-oss-120b
    litellm_params:
      model: cerebras/gpt-oss-120b
      api_key: os.environ/CEREBRAS_API_KEY
      drop_params: true
      additional_drop_params:
        - metadata
        - client_metadata
        - store
        - previous_response_id
        - truncation
        - background
        - include
        - max_tokens
        - n
        - parallel_tool_calls   # unsupported on gpt-oss-120b specifically
        - reasoning_effort      # drop what Codex sends (often invalid through the bridge)
        - reasoning             # same for the Responses-API reasoning object
      reasoning_effort: medium   # forced value, the only one reaching Cerebras

  # Same model as the main traffic, dedicated to auto-review: the proxy shrinks
  # the request to ~220 tokens upstream, so a verdict costs ~$0.0001 and lands
  # in about a second. `reasoning_effort: low` is the floor -- gpt-oss-120b
  # rejects "none".
  - model_name: cerebras-review
    litellm_params:
      model: cerebras/gpt-oss-120b
      api_key: os.environ/CEREBRAS_API_KEY
      drop_params: true
      additional_drop_params:
        - metadata
        - client_metadata
        - store
        - previous_response_id
        - truncation
        - background
        - include
        - max_tokens
        - n
        - parallel_tool_calls
        - reasoning_effort
        - reasoning
      reasoning_effort: low

  # Cerebras preview model, pricier, "evaluation only" -- kept as an option but
  # not recommended as the main model.
  - model_name: cerebras-zai-glm-4.7
    litellm_params:
      model: cerebras/zai-glm-4.7
      api_key: os.environ/CEREBRAS_API_KEY
      drop_params: true
      additional_drop_params:
        - metadata
        - client_metadata
        - store
        - previous_response_id
        - truncation
        - background
        - include
        - max_tokens
        - n

  # Free OpenRouter model, kept as a fallback option.
  - model_name: openrouter-free-review
    litellm_params:
      model: openrouter/tencent/hy3:free
      api_key: os.environ/OPENROUTER_API_KEY
      drop_params: true

# Codex internally calls a "codex-auto-review" model to assess the risk of a
# command before auto-approving it. Only the grey zone reaches this alias: the
# proxy pre-filter settles the clear-cut cases without any call at all.
#
# Routed to Cerebras rather than a local model: a 1.2B model ingests at
# ~12 tok/s, i.e. ~19 s before the first token even after the prompt is shrunk,
# which is past Codex's idle timeout. Accepted trade-off: the command being
# judged leaves the machine, like the rest of Codex traffic.
router_settings:
  model_group_alias:
    codex-auto-review: cerebras-review

# Silently ignore parameters Cerebras does not support (e.g.
# parallel_tool_calls, sent by default by Codex through the Responses API).
litellm_settings:
  drop_params: true

# Key Codex must present to the local proxy (any value; local auth only).
general_settings:
  master_key: sk-local-proxy-1234
