[project]
name = "codex-proxy"
version = "0.1.0"
description = "A local proxy that lets Codex CLI run on non-OpenAI backends, with a deterministic pre-filter for its auto-approval reviews."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "httpx>=0.27",
    "uvicorn>=0.30",
    "litellm[proxy]>=1.50",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.8",
    "mypy>=1.13",
]

[tool.pytest.ini_options]
testpaths = ["proxy/tests"]
pythonpath = ["."]

[tool.mypy]
strict = true

[tool.ruff]
line-length = 100
